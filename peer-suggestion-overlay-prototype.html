<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peer Suggestion Overlay Prototype</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f2f4f8;
        color: #111827;
      }

      .demo-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .demo-copy {
        max-width: 560px;
        text-align: center;
        color: #4b5563;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f3f4f6;
        }

        .demo-copy {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-page">
      <p class="demo-copy">
        Prototype host page. The peer suggestion overlay appears in the bottom-right and auto-dismisses
        after 30 seconds.
      </p>
    </main>

    <peer-suggestion-overlay
      match-id="match_42f9a1"
      peer-domain="Product Design"
      peer-experience="6+ years"
      peer-availability="Today"
    ></peer-suggestion-overlay>

    <script>
      class PeerSuggestionOverlay extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
          this.remainingSeconds = 30;
          this.dismissTimer = null;
          this.matchId = this.getAttribute("match-id") || "demo_match_001";
        }

        connectedCallback() {
          this.render();
          this.startCountdown();
          this.bindEvents();
        }

        disconnectedCallback() {
          if (this.dismissTimer) {
            clearInterval(this.dismissTimer);
            this.dismissTimer = null;
          }
        }

        render() {
          const domain = this.getAttribute("peer-domain") || "Product Design";
          const experience = this.getAttribute("peer-experience") || "6+ years";
          const availability = this.getAttribute("peer-availability") || "Today";

          this.shadowRoot.innerHTML = `
            <style>
              :host {
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 2147483647;
                font-family: Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
              }

              .card {
                width: min(380px, calc(100vw - 32px));
                background: #ffffff;
                border: 1px solid #d6deea;
                border-radius: 16px;
                box-shadow: 0 18px 40px rgba(12, 22, 42, 0.24);
                overflow: hidden;
                color: #111827;
              }

              .content {
                padding: 14px;
              }

              .suggestion {
                font-size: 18px;
                line-height: 1.25;
                letter-spacing: -0.01em;
                font-weight: 700;
                margin: 0 0 8px;
                color: #111827;
              }

              .subtle {
                margin: 0 0 12px;
                font-size: 14px;
                line-height: 1.4;
                color: #334155;
              }

              .peer-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                margin-bottom: 12px;
              }

              .peer-item {
                background: #f3f6fb;
                border: 1px solid #dbe4f2;
                border-radius: 10px;
                padding: 9px;
              }

              .peer-item strong {
                display: block;
                font-size: 13px;
                line-height: 1.2;
                color: #0f172a;
              }

              .peer-item span {
                display: block;
                margin-top: 4px;
                font-size: 11px;
                line-height: 1.2;
                letter-spacing: 0.02em;
                text-transform: uppercase;
                color: #475569;
                font-weight: 700;
              }

              .actions {
                display: flex;
                gap: 8px;
              }

              button {
                border: 1px solid transparent;
                border-radius: 12px;
                padding: 10px 12px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                min-height: 42px;
              }

              button:focus-visible {
                outline: 3px solid #2563eb;
                outline-offset: 2px;
              }

              .connect-btn {
                flex: 1;
                background: linear-gradient(135deg, #4f46e5 0%, #6d28d9 100%);
                color: #ffffff;
              }

              .dismiss-btn {
                flex: 1;
                background: #f8fafc;
                color: #0f172a;
                border-color: #cbd5e1;
              }

              .timer-row {
                border-top: 1px solid #dbe4f2;
                background: #f8fafc;
                padding: 8px 14px 10px;
              }

              .timer-meta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 12px;
                color: #334155;
                font-weight: 700;
              }

              .timer-bar {
                margin-top: 6px;
                width: 100%;
                height: 6px;
                border-radius: 999px;
                background: #dbe4f2;
                overflow: hidden;
              }

              .timer-progress {
                height: 100%;
                width: 100%;
                background: linear-gradient(90deg, #f59e0b 0%, #f97316 100%);
                transition: width 1s linear;
              }

              @media (prefers-color-scheme: dark) {
                .card {
                  background: #0f172a;
                  border-color: #334155;
                  color: #f8fafc;
                  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
                }

                .suggestion {
                  color: #f8fafc;
                }

                .subtle {
                  color: #cbd5e1;
                }

                .peer-item {
                  background: #1e293b;
                  border-color: #334155;
                }

                .peer-item strong {
                  color: #f8fafc;
                }

                .peer-item span {
                  color: #cbd5e1;
                }

                .dismiss-btn {
                  background: #1e293b;
                  border-color: #475569;
                  color: #f8fafc;
                }

                .timer-row {
                  border-top-color: #334155;
                  background: #111827;
                }

                .timer-meta {
                  color: #e2e8f0;
                }

                .timer-bar {
                  background: #334155;
                }
              }
            </style>

            <section
              class="card"
              role="dialog"
              aria-live="polite"
              aria-label="Peer suggestion"
              aria-describedby="peerSuggestionDesc"
            >
              <div class="content">
                <p class="suggestion">Solved a similar challenge.</p>
                <p class="subtle" id="peerSuggestionDesc">
                  A quick peer conversation may help more than another search result right now.
                </p>

                <div class="peer-grid" aria-label="Anonymised peer summary">
                  <div class="peer-item">
                    <strong>${domain}</strong>
                    <span>Domain</span>
                  </div>
                  <div class="peer-item">
                    <strong>${experience}</strong>
                    <span>Experience</span>
                  </div>
                  <div class="peer-item">
                    <strong>${availability}</strong>
                    <span>Availability</span>
                  </div>
                </div>

                <div class="actions">
                  <button type="button" class="connect-btn" id="connectBtn">Connect</button>
                  <button type="button" class="dismiss-btn" id="dismissBtn">Not now</button>
                </div>
              </div>

              <div class="timer-row">
                <div class="timer-meta">
                  <span>Auto dismiss</span>
                  <span><span id="secondsLeft">30</span>s</span>
                </div>
                <div class="timer-bar" aria-hidden="true">
                  <div class="timer-progress" id="timerProgress"></div>
                </div>
              </div>
            </section>
          `;
        }

        bindEvents() {
          const connectBtn = this.shadowRoot.getElementById("connectBtn");
          const dismissBtn = this.shadowRoot.getElementById("dismissBtn");

          connectBtn.addEventListener("click", () => {
            console.log("Connect clicked. match_id:", this.matchId);
            alert(`Connect clicked for ${this.matchId}`);
          });

          dismissBtn.addEventListener("click", () => this.dismiss());

          this.shadowRoot.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              this.dismiss();
            }
          });
        }

        startCountdown() {
          const secondsEl = this.shadowRoot.getElementById("secondsLeft");
          const progressEl = this.shadowRoot.getElementById("timerProgress");

          this.dismissTimer = setInterval(() => {
            this.remainingSeconds -= 1;
            const clamped = Math.max(this.remainingSeconds, 0);
            const percentage = (clamped / 30) * 100;

            secondsEl.textContent = String(clamped);
            progressEl.style.width = percentage + "%";

            if (clamped <= 0) {
              this.dismiss();
            }
          }, 1000);
        }

        dismiss() {
          if (this.dismissTimer) {
            clearInterval(this.dismissTimer);
            this.dismissTimer = null;
          }
          this.remove();
        }
      }

      customElements.define("peer-suggestion-overlay", PeerSuggestionOverlay);
    </script>
  </body>
</html>
