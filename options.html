<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peer Connect Settings</title>
    <link rel="stylesheet" href="styles/shared.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options-wrap">
      <section class="panel wide">
        <h1>Peer Connect Settings</h1>
        <p class="muted space-top">Adjust matching behavior and privacy-safe goal context.</p>

        <div class="field space-top">
          <label for="goalContext">Goal context</label>
          <textarea id="goalContext" rows="4" maxlength="200" aria-label="Goal context"></textarea>
        </div>

        <div class="field space-top">
          <label for="frequency">Suggestion frequency</label>
          <select id="frequency" aria-label="Suggestion frequency">
            <option value="active">Active</option>
            <option value="reduced">Reduced</option>
            <option value="paused">Paused</option>
          </select>
        </div>

        <label class="toggle space-top">
          <input id="isPaused" type="checkbox" aria-label="Pause extension" />
          Pause extension
        </label>

        <div class="row space-top">
          <button id="saveBtn" class="btn btn-primary">Save settings</button>
          <button id="pauseTodayBtn" class="btn btn-ghost">Pause for today</button>
        </div>
        <p id="feedback" class="muted space-top" aria-live="polite"></p>
      </section>
    </main>
    <script src="crypto.js"></script>
    <script src="storage.js"></script>
    <script src="options.js"></script>
  </body>
</html>
